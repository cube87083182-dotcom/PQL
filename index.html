<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PARKOUR RUSH 1v1 - 실시간 파쿠르 레이스</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }
    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 가로 회전 안내 */
    #rotate-notice {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #020617;
      color: #f8fafc;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    @media (orientation: portrait) and (max-width: 900px) {
      #rotate-notice { display: flex; }
    }

    /* 상단 HUD */
    #hud {
      position: fixed;
      top: 10px;
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }
    .hud-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .hud-badge {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 5px 10px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }
    #btn-exit-match {
      pointer-events: auto;
      background: rgba(239, 68, 68, 0.92);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .progress-track {
      position: relative;
      width: 100%;
      height: 14px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      overflow: visible;
    }
    .progress-fill-me {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #3b82f6);
      border-radius: 999px;
      transition: width 0.08s linear;
    }
    .marker-dot {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
    }
    #marker-me { background: #2563eb; left: 0%; z-index: 2; }
    #marker-opp { background: #ef4444; left: 0%; z-index: 1; }

    /* 오버레이 공통 (숨김 시 pointer-events: none으로 터치 차단 완벽 해제) */
    .overlay-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(2, 6, 23, 0.84);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      pointer-events: auto;
    }
    .overlay-screen.hidden {
      display: none !important;
      pointer-events: none !important;
    }

    .panel {
      width: 100%;
      max-width: 680px;
      max-height: 92vh;
      overflow-y: auto;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      touch-action: pan-y;
    }
    .title {
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      background: linear-gradient(90deg, #38bdf8, #a855f7, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 14px;
    }

    /* 스킨 선택 그리드 (10종) */
    .skin-label {
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .skin-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .skin-card {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.15s;
    }
    .skin-card.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.16);
      transform: scale(1.03);
    }
    .skin-preview {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 2px solid rgba(255, 255, 255, 0.65);
      position: relative;
    }
    .skin-name {
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
      text-align: center;
      white-space: nowrap;
    }

    /* 로비 액션 버튼 */
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .main-btn {
      flex: 1;
      min-width: 180px;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
      transition: transform 0.08s;
    }
    .main-btn:active { transform: scale(0.97); }
    .btn-online {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }
    .btn-bot {
      background: linear-gradient(135deg, #059669, #10b981);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
    }
    #match-status {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      min-height: 20px;
    }
    .controls-hint {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
    }

    /* 카운트다운 */
    #countdown-overlay {
      position: fixed;
      inset: 0;
      z-index: 45;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.85);
      pointer-events: none;
    }
    #countdown-overlay.hidden { display: none !important; }

    /* 모바일 & 마우스 터치 컨트롤러 */
    #touch-controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 145px;
      z-index: 35;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      pointer-events: none;
    }
    .ctrl-group {
      display: flex;
      gap: 14px;
      pointer-events: none;
    }
    .touch-btn {
      pointer-events: auto;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.74);
      border: 3px solid rgba(255, 255, 255, 0.38);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      touch-action: none;
      cursor: pointer;
      transition: transform 0.05s, background 0.05s, border-color 0.05s;
    }
    .touch-btn.pressed {
      transform: scale(0.91);
      background: rgba(56, 189, 248, 0.58);
      border-color: #38bdf8;
    }
    #btn-jump {
      width: 84px;
      height: 84px;
      border-color: rgba(52, 211, 153, 0.7);
    }
    #btn-jump.pressed {
      background: rgba(16, 185, 129, 0.62);
      border-color: #34d399;
    }
    #btn-dash {
      width: 76px;
      height: 76px;
      border-color: rgba(251, 191, 36, 0.75);
      position: relative;
    }
    #btn-dash.cooldown {
      opacity: 0.55;
      border-color: #64748b;
    }
    #btn-dash.pressed {
      background: rgba(245, 158, 11, 0.65);
      border-color: #fbbf24;
    }
    .sub-cd {
      font-size: 11px;
      font-weight: 800;
      color: #fde047;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <!-- 세로 화면 회전 안내 -->
  <div id="rotate-notice">
    <div style="font-size:44px;margin-bottom:12px;">📱🔄</div>
    <div style="font-size:18px;font-weight:800;margin-bottom:6px;">가로 화면으로 회전해 주세요</div>
    <div style="font-size:13px;color:#94a3b8;">1대1 파쿠르 레이스는 가로 모드에 최적화되어 있습니다.</div>
  </div>

  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- 상단 HUD -->
    <div id="hud">
      <div class="hud-top-row">
        <div class="hud-badge" id="hud-map">🗺️ 맵: 대기 중</div>
        <div class="hud-badge" id="hud-timer">⏱️ 00.00s</div>
        <div class="hud-badge" id="hud-mode">연습 모드</div>
        <button id="btn-exit-match" type="button">로비로</button>
      </div>
      <div class="progress-track">
        <div class="progress-fill-me" id="progress-me"></div>
        <div class="marker-dot" id="marker-opp" title="상대">P2</div>
        <div class="marker-dot" id="marker-me" title="나">나</div>
      </div>
    </div>

    <!-- 카운트다운 -->
    <div id="countdown-overlay" class="hidden">3</div>

    <!-- 모바일 & 마우스 터치 컨트롤 -->
    <div id="touch-controls">
      <div class="ctrl-group">
        <button type="button" class="touch-btn" id="btn-left">◀</button>
        <button type="button" class="touch-btn" id="btn-right">▶</button>
      </div>
      <div class="ctrl-group">
        <button type="button" class="touch-btn" id="btn-dash">
          <span>DASH</span>
          <span class="sub-cd" id="dash-cd-text">READY</span>
        </button>
        <button type="button" class="touch-btn" id="btn-jump">JUMP</button>
      </div>
    </div>

    <!-- 메인 로비 -->
    <div id="lobby-screen" class="overlay-screen">
      <div class="panel">
        <div class="title">PARKOUR RUSH 1v1</div>
        <div class="subtitle">12종 랜덤 맵 · 3초 쿨타임 대쉬 · 실시간 온라인 1대1 레이스</div>

        <div class="skin-label">
          <span>🎨 캐릭터 스킨 선택 (10종)</span>
          <span id="selected-skin-label" style="color:#38bdf8;">기본 러너</span>
        </div>
        <div class="skin-grid" id="skin-grid"></div>

        <div class="btn-row">
          <button type="button" class="main-btn btn-online" id="btn-random-match">🌐 랜덤 매치 시작 (1v1)</button>
          <button type="button" class="main-btn btn-bot" id="btn-bot-match">🤖 AI 봇 1v1 연습</button>
        </div>
        <div id="match-status">원하는 모드를 선택해 레이스를 시작하세요!</div>
        <div class="controls-hint">
          💻 PC 키보드: A/D 또는 ←/→ 이동 · Space/W 점프 · Shift/E 대쉬(3초 쿨타임)
        </div>
      </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="overlay-screen hidden">
      <div class="panel" style="max-width:440px;text-align:center;">
        <div id="result-icon" style="font-size:52px;margin-bottom:6px;">🏆</div>
        <div id="result-title" class="title" style="font-size:28px;">1v1 승리!</div>
        <div id="result-desc" style="font-size:14px;color:#cbd5e1;margin:10px 0 18px;">결승선에 먼저 도착했습니다!</div>
        <div class="btn-row">
          <button type="button" class="main-btn btn-online" id="btn-rematch">다시 매칭하기</button>
          <button type="button" class="main-btn btn-bot" id="btn-result-lobby">로비로 이동</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. Web Audio API 효과음 생성기
    // ==========================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, duration, type = "sine", vol = 0.08, slideTo = null) {
      try {
        if (!AudioCtx) return;
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
        }
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // ==========================================
    // 2. 10가지 캐릭터 스킨 데이터
    // ==========================================
    const SKINS = [
      { id: 0, name: "기본 러너", body: "#38bdf8", accent: "#0284c7", eye: "#ffffff", band: "#facc15" },
      { id: 1, name: "네온 사이버", body: "#a855f7", accent: "#6b21a8", eye: "#22d3ee", band: "#f472b6" },
      { id: 2, name: "파이어 닌자", body: "#ef4444", accent: "#991b1b", eye: "#fef08a", band: "#1e293b" },
      { id: 3, name: "골드 챔피언", body: "#f59e0b", accent: "#b45309", eye: "#ffffff", band: "#fef3c7" },
      { id: 4, name: "우주인", body: "#f8fafc", accent: "#94a3b8", eye: "#38bdf8", band: "#0f172a" },
      { id: 5, name: "고릴라 파워", body: "#475569", accent: "#1e293b", eye: "#fbbf24", band: "#a3e635" },
      { id: 6, name: "아이스 슬라임", body: "#67e8f9", accent: "#06b6d4", eye: "#0f172a", band: "#ffffff" },
      { id: 7, name: "다크 팬텀", body: "#1e1b4b", accent: "#090d16", eye: "#f43f5e", band: "#818cf8" },
      { id: 8, name: "개구리 점퍼", body: "#4ade80", accent: "#15803d", eye: "#fef08a", band: "#fb7185" },
      { id: 9, name: "레인보우 큐브", body: "#ec4899", accent: "#8b5cf6", eye: "#ffffff", band: "#34d399" }
    ];

    let selectedSkinId = Number(localStorage.getItem("parkour_skin_id") || 0);
    if (!SKINS[selectedSkinId]) selectedSkinId = 0;

    function renderSkinGrid() {
      const grid = document.getElementById("skin-grid");
      grid.innerHTML = "";
      SKINS.forEach(skin => {
        const card = document.createElement("div");
        card.className = "skin-card" + (skin.id === selectedSkinId ? " active" : "");
        card.innerHTML = `
          <div class="skin-preview" style="background:${skin.body}; border-color:${skin.band};">
            <div style="position:absolute;top:6px;right:4px;width:6px;height:6px;border-radius:50%;background:${skin.eye};"></div>
          </div>
          <div class="skin-name">${skin.name}</div>
        `;
        card.addEventListener("click", () => {
          selectedSkinId = skin.id;
          localStorage.setItem("parkour_skin_id", String(selectedSkinId));
          document.getElementById("selected-skin-label").textContent = skin.name;
          renderSkinGrid();
        });
        grid.appendChild(card);
      });
      document.getElementById("selected-skin-label").textContent = SKINS[selectedSkinId].name;
    }
    renderSkinGrid();

    // ==========================================
    // 3. 12가지 랜덤 맵 생성기 (시드 기반 동일 코스 생성)
    // ==========================================
    const MAP_THEMES = [
      { id: 0, name: "1. 초원의 시작", bgTop: "#0f172a", bgBot: "#1e3a5f", plat: "#22c55e", platTop: "#86efac", hazard: "#ef4444" },
      { id: 1, name: "2. 용암 협곡", bgTop: "#1f0909", bgBot: "#450a0a", plat: "#78716c", platTop: "#f97316", hazard: "#ff2a2a" },
      { id: 2, name: "3. 하늘 계단", bgTop: "#0c4a6e", bgBot: "#38bdf8", plat: "#f8fafc", platTop: "#bae6fd", hazard: "#f43f5e" },
      { id: 3, name: "4. 움직이는 공장", bgTop: "#18181b", bgBot: "#3f3f46", plat: "#eab308", platTop: "#fef08a", hazard: "#ef4444" },
      { id: 4, name: "5. 얼음 빙판길", bgTop: "#082f49", bgBot: "#0284c7", plat: "#a5f3fc", platTop: "#ffffff", hazard: "#e11d48" },
      { id: 5, name: "6. 스프링 타워", bgTop: "#2e1065", bgBot: "#581c87", plat: "#c084fc", platTop: "#f3e8ff", hazard: "#fb7185" },
      { id: 6, name: "7. 네온 사이버", bgTop: "#090d16", bgBot: "#1e1b4b", plat: "#2563eb", platTop: "#22d3ee", hazard: "#f43f5e" },
      { id: 7, name: "8. 사막 피라미드", bgTop: "#451a03", bgBot: "#92400e", plat: "#f59e0b", platTop: "#fde68a", hazard: "#dc2626" },
      { id: 8, name: "9. 정글 유적", bgTop: "#052e16", bgBot: "#14532d", plat: "#65a30d", platTop: "#bef264", hazard: "#ef4444" },
      { id: 9, name: "10. 우주 정거장", bgTop: "#020617", bgBot: "#0f172a", plat: "#64748b", platTop: "#e2e8f0", hazard: "#f97316" },
      { id: 10, name: "11. 심해 연구소", bgTop: "#042f2e", bgBot: "#115e59", plat: "#14b8a6", platTop: "#99f6e4", hazard: "#fb7185" },
      { id: 11, name: "12. 최종 시련", bgTop: "#1e1b4b", bgBot: "#4c0519", plat: "#f43f5e", platTop: "#fecdd3", hazard: "#facc15" }
    ];

    function mulberry32(seed) {
      return function () {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function buildCourse(mapIndex, seed) {
      const theme = MAP_THEMES[mapIndex % MAP_THEMES.length];
      const rand = mulberry32(seed);
      const platforms = [];
      const hazards = [];
      const springs = [];
      const checkpoints = [];

      // 넓은 시작 바닥 (바닥이 명확히 보이도록 크게 배치)
      platforms.push({ x: -120, y: 420, w: 520, h: 80, moveX: 0, moveY: 0, speed: 0, baseX: -120, baseY: 420, ice: mapIndex === 4 });
      checkpoints.push({ x: 80, y: 380 });

      let curX = 460;
      let curY = 400;
      const totalSegments = 22;

      for (let i = 0; i < totalSegments; i++) {
        const gap = 85 + Math.floor(rand() * 85);
        const w = (mapIndex === 2 ? 105 : 130) + Math.floor(rand() * 95);
        const deltaY = Math.floor((rand() - 0.52) * 120);
        curX += gap;
        curY = Math.max(160, Math.min(540, curY + deltaY));

        let moveX = 0, moveY = 0, speed = 0;
        if (mapIndex === 3 || (i % 4 === 2 && rand() > 0.35)) {
          if (rand() > 0.5) { moveX = 55; speed = 2.2; }
          else { moveY = 45; speed = 2.0; }
        }

        platforms.push({
          x: curX, y: curY, w, h: 36,
          baseX: curX, baseY: curY,
          moveX, moveY, speed,
          ice: mapIndex === 4
        });

        // 스프링 점프대
        if (mapIndex === 5 || (i % 5 === 3 && rand() > 0.3)) {
          springs.push({ x: curX + w * 0.5 - 18, y: curY - 14, w: 36, h: 14 });
        }

        // 장애물
        if (w >= 150 && i > 1 && i % 3 === 1) {
          hazards.push({ x: curX + w * 0.45, y: curY - 14, w: 32, h: 14 });
        }

        // 체크포인트 (6, 12, 18번째)
        if (i === 6 || i === 12 || i === 18) {
          checkpoints.push({ x: curX + w * 0.5, y: curY - 40 });
        }

        curX += w;
      }

      // 결승선 플랫폼
      const finishX = curX + 110;
      const finishY = curY;
      platforms.push({
        x: finishX, y: finishY, w: 340, h: 80,
        baseX: finishX, baseY: finishY,
        moveX: 0, moveY: 0, speed: 0, ice: false
      });

      const goal = { x: finishX + 160, y: finishY - 110, w: 24, h: 110 };

      return { theme, platforms, hazards, springs, checkpoints, goal, startX: 80, startY: 360 };
    }

    // ==========================================
    // 4. 캔버스 리사이즈
    // ==========================================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let viewW = window.innerWidth;
    let viewH = window.innerHeight;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      viewW = Math.max(320, rect.width || window.innerWidth);
      viewH = Math.max(240, rect.height || window.innerHeight);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(viewW * dpr);
      canvas.height = Math.floor(viewH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    if (window.ResizeObserver) {
      new ResizeObserver(resizeCanvas).observe(document.getElementById("game-wrapper"));
    }
    resizeCanvas();

    // ==========================================
    // 5. 입력 처리 (터치 & 키보드 직접 바인딩)
    // ==========================================
    const input = { left: false, right: false, jump: false, dash: false };

    function bindButton(el, keyName, onTrigger) {
      const press = (e) => {
        if (e.cancelable) e.preventDefault();
        input[keyName] = true;
        el.classList.add("pressed");
        if (onTrigger) onTrigger();
      };
      const release = (e) => {
        if (e && e.cancelable) e.preventDefault();
        input[keyName] = false;
        el.classList.remove("pressed");
      };

      el.addEventListener("touchstart", press, { passive: false });
      el.addEventListener("touchend", release, { passive: false });
      el.addEventListener("touchcancel", release, { passive: false });
      el.addEventListener("mousedown", press);
      el.addEventListener("mouseup", release);
      el.addEventListener("mouseleave", release);
    }

    bindButton(document.getElementById("btn-left"), "left");
    bindButton(document.getElementById("btn-right"), "right");
    bindButton(document.getElementById("btn-jump"), "jump", () => tryJump());
    bindButton(document.getElementById("btn-dash"), "dash", () => tryDash());

    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") input.left = true;
      if (e.code === "ArrowRight" || e.code === "KeyD") input.right = true;
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
        if (!input.jump) tryJump();
        input.jump = true;
      }
      if (e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyE") {
        if (!input.dash) tryDash();
        input.dash = true;
      }
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") input.left = false;
      if (e.code === "ArrowRight" || e.code === "KeyD") input.right = false;
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") input.jump = false;
      if (e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyE") input.dash = false;
    });
    window.addEventListener("blur", () => {
      input.left = input.right = input.jump = input.dash = false;
      document.querySelectorAll(".touch-btn").forEach(b => b.classList.remove("pressed"));
    });

    // ==========================================
    // 6. 게임 물리 & 상태
    // ==========================================
    let currentCourse = buildCourse(0, 12345);
    let gameState = "LOBBY"; // LOBBY, MATCHING, COUNTDOWN, RACING, FINISHED
    let matchMode = "BOT"; // BOT or ONLINE
    let raceStartTime = 0;
    let elapsedTime = 0;

    const player = {
      x: 80, y: 360, w: 30, h: 38,
      vx: 0, vy: 0,
      facing: 1,
      grounded: false,
      coyoteTimer: 0,
      dashCooldown: 0,
      dashActiveTimer: 0,
      respawnX: 80, respawnY: 360,
      finished: false
    };

    const opponent = {
      active: false,
      x: 80, y: 360, w: 30, h: 38,
      facing: 1,
      skinId: 2,
      progress: 0,
      finished: false,
      targetX: 80, targetY: 360
    };

    function resetPlayersForCourse(course) {
      player.x = course.startX;
      player.y = course.startY;
      player.vx = 0;
      player.vy = 0;
      player.facing = 1;
      player.grounded = false;
      player.dashCooldown = 0;
      player.dashActiveTimer = 0;
      player.respawnX = course.startX;
      player.respawnY = course.startY;
      player.finished = false;

      opponent.active = true;
      opponent.x = course.startX;
      opponent.y = course.startY;
      opponent.targetX = course.startX;
      opponent.targetY = course.startY;
      opponent.facing = 1;
      opponent.progress = 0;
      opponent.finished = false;
    }

    function tryJump() {
      if (gameState !== "RACING") return;
      if (player.grounded || player.coyoteTimer > 0) {
        player.vy = -660;
        player.grounded = false;
        player.coyoteTimer = 0;
        playTone(320, 0.14, "sine", 0.08, 620);
      }
    }

    function tryDash() {
      if (gameState !== "RACING") return;
      if (player.dashCooldown <= 0) {
        player.dashCooldown = 3.0; // 3초 쿨타임
        player.dashActiveTimer = 0.18;
        player.vx = player.facing * 920;
        player.vy = Math.min(player.vy, 0) * 0.25;
        playTone(680, 0.16, "sawtooth", 0.07, 220);
      }
    }

    // ==========================================
    // 7. 실시간 온라인 1v1 매칭 (MQTT + WebRTC PeerJS)
    // ==========================================
    let mqttClient = null;
    let peer = null;
    let conn = null;
    let myPeerId = "pk_" + Math.random().toString(36).slice(2, 10);
    let isHost = false;
    let syncInterval = null;
    let matchTimeout = null;

    function cleanupNetwork() {
      if (syncInterval) { clearInterval(syncInterval); syncInterval = null; }
      if (matchTimeout) { clearTimeout(matchTimeout); matchTimeout = null; }
      if (conn) { try { conn.close(); } catch (e) {} conn = null; }
      if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
      if (mqttClient) { try { mqttClient.end(true); } catch (e) {} mqttClient = null; }
    }

    function startMatchSequence(mapIdx, seed, modeLabel) {
      gameState = "COUNTDOWN";
      currentCourse = buildCourse(mapIdx, seed);
      resetPlayersForCourse(currentCourse);

      document.getElementById("lobby-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("hud-map").textContent = "🗺️ " + currentCourse.theme.name;
      document.getElementById("hud-mode").textContent = modeLabel;

      const cdEl = document.getElementById("countdown-overlay");
      cdEl.classList.remove("hidden");
      let count = 3;
      cdEl.textContent = String(count);
      playTone(440, 0.15, "triangle", 0.08);

      const timer = setInterval(() => {
        if (gameState !== "COUNTDOWN") {
          clearInterval(timer);
          cdEl.classList.add("hidden");
          return;
        }
        count--;
        if (count > 0) {
          cdEl.textContent = String(count);
          playTone(440, 0.15, "triangle", 0.08);
        } else if (count === 0) {
          cdEl.textContent = "GO!";
          playTone(880, 0.28, "triangle", 0.11);
          gameState = "RACING";
          raceStartTime = performance.now();
        } else {
          cdEl.classList.add("hidden");
          clearInterval(timer);
        }
      }, 850);
    }

    function startBotMatch() {
      cleanupNetwork();
      matchMode = "BOT";
      opponent.skinId = (selectedSkinId + 3) % SKINS.length;
      const randomMap = Math.floor(Math.random() * 12);
      const seed = Math.floor(Math.random() * 999999);
      startMatchSequence(randomMap, seed, "🤖 AI 봇 대전");
    }

    function startOnlineMatch() {
      cleanupNetwork();
      matchMode = "ONLINE";
      gameState = "MATCHING";
      const statusEl = document.getElementById("match-status");
      statusEl.textContent = "🌐 전 세계 대기열 연결 중...";

      myPeerId = "pk_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 6);
      peer = new Peer(myPeerId);

      peer.on("open", () => {
        statusEl.textContent = "🔍 1대1 상대를 찾는 중... (다른 탭/기기에서 동시에 누르면 즉시 매칭)";
        const topic = "parkour-rush-1v1-global-queue-v1";
        mqttClient = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
          clientId: myPeerId,
          clean: true,
          connectTimeout: 5000
        });

        mqttClient.on("connect", () => {
          mqttClient.subscribe(topic);
          const announce = () => {
            if (gameState === "MATCHING" && mqttClient) {
              mqttClient.publish(topic, JSON.stringify({ type: "SEEK", id: myPeerId, skin: selectedSkinId }));
            }
          };
          announce();
          matchTimeout = setInterval(announce, 1800);
        });

        mqttClient.on("message", (t, payload) => {
          if (gameState !== "MATCHING") return;
          try {
            const msg = JSON.parse(payload.toString());
            if (msg.type === "SEEK" && msg.id && msg.id !== myPeerId) {
              if (myPeerId > msg.id) {
                isHost = true;
                opponent.skinId = msg.skin ?? 1;
                const connection = peer.connect(msg.id, { reliable: true });
                setupPeerConnection(connection);
              }
            }
          } catch (e) {}
        });
      });

      peer.on("connection", (incomingConn) => {
        if (gameState !== "MATCHING") {
          incomingConn.close();
          return;
        }
        isHost = false;
        setupPeerConnection(incomingConn);
      });

      peer.on("error", () => {
        if (gameState === "MATCHING") {
          statusEl.textContent = "⚠️ 네트워크 연결 불안정 - AI 봇 대전으로 전환하거나 다시 시도하세요.";
        }
      });
    }

    function setupPeerConnection(connection) {
      conn = connection;
      if (matchTimeout) { clearInterval(matchTimeout); matchTimeout = null; }
      if (mqttClient) { try { mqttClient.end(true); } catch (e) {} mqttClient = null; }

      conn.on("open", () => {
        document.getElementById("match-status").textContent = "✅ 상대 발견! 레이스를 준비합니다...";
        if (isHost) {
          const mapIdx = Math.floor(Math.random() * 12);
          const seed = Math.floor(Math.random() * 999999);
          conn.send({ type: "START", mapIdx, seed, skin: selectedSkinId });
          startMatchSequence(mapIdx, seed, "🌐 온라인 1v1");
        } else {
          conn.send({ type: "HELLO", skin: selectedSkinId });
        }

        syncInterval = setInterval(() => {
          if (conn && conn.open && (gameState === "RACING" || gameState === "COUNTDOWN")) {
            conn.send({
              type: "POS",
              x: Math.round(player.x),
              y: Math.round(player.y),
              facing: player.facing,
              progress: getProgress(player.x)
            });
          }
        }, 45);
      });

      conn.on("data", (data) => {
        if (!data || typeof data !== "object") return;
        if (data.type === "HELLO") {
          opponent.skinId = data.skin ?? 1;
        } else if (data.type === "START") {
          opponent.skinId = data.skin ?? 1;
          startMatchSequence(data.mapIdx, data.seed, "🌐 온라인 1v1");
        } else if (data.type === "POS") {
          opponent.targetX = data.x;
          opponent.targetY = data.y;
          opponent.facing = data.facing || 1;
          opponent.progress = data.progress || 0;
        } else if (data.type === "WIN") {
          if (gameState === "RACING") {
            finishRace(false, "상대가 먼저 결승선을 통과했습니다!");
          }
        }
      });

      conn.on("close", () => {
        if (gameState === "RACING" || gameState === "COUNTDOWN") {
          finishRace(true, "상대방의 연결이 끊어져 부전승했습니다!");
        }
      });
    }

    // ==========================================
    // 8. 물리 업데이트 & 렌더링 루프
    // ==========================================
    function getProgress(x) {
      const totalDist = Math.max(1, currentCourse.goal.x - currentCourse.startX);
      return Math.max(0, Math.min(100, ((x - currentCourse.startX) / totalDist) * 100));
    }

    function finishRace(isWin, reasonText) {
      gameState = "FINISHED";
      if (isWin) {
        playTone(523.25, 0.14, "triangle", 0.1);
        setTimeout(() => playTone(783.99, 0.25, "triangle", 0.1), 130);
      } else {
        playTone(260, 0.28, "sawtooth", 0.08, 150);
      }
      document.getElementById("result-icon").textContent = isWin ? "🏆" : "🥈";
      document.getElementById("result-title").textContent = isWin ? "1v1 승리!" : "아쉬운 패배!";
      document.getElementById("result-desc").textContent = `${reasonText} (기록: ${elapsedTime.toFixed(2)}초)`;
      document.getElementById("result-screen").classList.remove("hidden");
    }

    function updatePhysics(dt, timeSec) {
      // 움직이는 발판 갱신
      for (const p of currentCourse.platforms) {
        if (p.moveX !== 0) {
          p.x = p.baseX + Math.sin(timeSec * p.speed) * p.moveX;
        }
        if (p.moveY !== 0) {
          p.y = p.baseY + Math.cos(timeSec * p.speed) * p.moveY;
        }
      }

      if (gameState !== "RACING") return;

      elapsedTime = (performance.now() - raceStartTime) / 1000;
      document.getElementById("hud-timer").textContent = `⏱️ ${elapsedTime.toFixed(2)}s`;

      // 대쉬 쿨타임 갱신
      if (player.dashCooldown > 0) {
        player.dashCooldown = Math.max(0, player.dashCooldown - dt);
        document.getElementById("btn-dash").classList.add("cooldown");
        document.getElementById("dash-cd-text").textContent = player.dashCooldown.toFixed(1) + "s";
      } else {
        document.getElementById("btn-dash").classList.remove("cooldown");
        document.getElementById("dash-cd-text").textContent = "READY";
      }

      // 좌우 이동
      if (player.dashActiveTimer > 0) {
        player.dashActiveTimer -= dt;
      } else {
        const moveDir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
        if (moveDir !== 0) player.facing = moveDir;
        const targetVx = moveDir * 360;
        const accel = player.grounded ? 2600 : 1800;
        if (player.vx < targetVx) player.vx = Math.min(targetVx, player.vx + accel * dt);
        else if (player.vx > targetVx) player.vx = Math.max(targetVx, player.vx - accel * dt);
      }

      // 중력
      player.vy += 1550 * dt;
      if (player.vy > 1100) player.vy = 1100;

      const prevBottom = player.y + player.h;
      player.x += player.vx * dt;
      player.y += player.vy * dt;

      if (player.grounded) player.coyoteTimer = 0.1;
      else player.coyoteTimer = Math.max(0, player.coyoteTimer - dt);
      player.grounded = false;

      // 발판 착지 충돌
      for (const p of currentCourse.platforms) {
        if (
          player.x + player.w > p.x &&
          player.x < p.x + p.w &&
          player.vy >= 0 &&
          prevBottom <= p.y + 18 &&
          player.y + player.h >= p.y
        ) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.grounded = true;
        }
      }

      // 스프링(점프대)
      for (const s of currentCourse.springs) {
        if (
          player.x + player.w > s.x &&
          player.x < s.x + s.w &&
          player.y + player.h > s.y &&
          player.y < s.y + s.h
        ) {
          player.vy = -960;
          player.grounded = false;
          playTone(360, 0.22, "triangle", 0.09, 920);
        }
      }

      // 체크포인트 활성화
      for (const cp of currentCourse.checkpoints) {
        if (Math.abs((player.x + player.w * 0.5) - cp.x) < 42 && Math.abs((player.y + player.h) - (cp.y + 40)) < 65) {
          if (player.respawnX !== cp.x - player.w * 0.5) {
            player.respawnX = cp.x - player.w * 0.5;
            player.respawnY = cp.y;
            playTone(580, 0.14, "sine", 0.07, 860);
          }
        }
      }

      // 장애물 또는 낙하 시 체크포인트 복귀
      let hitHazard = false;
      for (const h of currentCourse.hazards) {
        if (
          player.x + player.w - 4 > h.x &&
          player.x + 4 < h.x + h.w &&
          player.y + player.h > h.y &&
          player.y < h.y + h.h
        ) {
          hitHazard = true;
          break;
        }
      }
      if (hitHazard || player.y > 860) {
        player.x = player.respawnX;
        player.y = player.respawnY;
        player.vx = 0;
        player.vy = 0;
        playTone(210, 0.2, "sawtooth", 0.07, 110);
      }

      // 봇 또는 온라인 상대 보간
      if (matchMode === "BOT") {
        const botSpeed = 315;
        opponent.x += botSpeed * dt;
        opponent.facing = 1;
        let supportPlat = currentCourse.platforms[0];
        for (const p of currentCourse.platforms) {
          if (opponent.x + 15 >= p.x - 40 && opponent.x <= p.x + p.w + 40) {
            supportPlat = p;
          }
        }
        const desiredY = supportPlat.y - opponent.h - Math.abs(Math.sin(timeSec * 5)) * 48;
        opponent.y += (desiredY - opponent.y) * Math.min(1, dt * 8);
        opponent.progress = getProgress(opponent.x);

        if (opponent.x >= currentCourse.goal.x && !opponent.finished) {
          opponent.finished = true;
          finishRace(false, "AI 봇이 먼저 결승선에 도달했습니다!");
          return;
        }
      } else {
        opponent.x += (opponent.targetX - opponent.x) * Math.min(1, dt * 16);
        opponent.y += (opponent.targetY - opponent.y) * Math.min(1, dt * 16);
      }

      // 진행도 UI 업데이트
      const myProg = getProgress(player.x);
      document.getElementById("progress-me").style.width = myProg + "%";
      document.getElementById("marker-me").style.left = myProg + "%";
      document.getElementById("marker-opp").style.left = opponent.progress + "%";

      // 결승선 통과 확인
      if (player.x + player.w >= currentCourse.goal.x && !player.finished) {
        player.finished = true;
        if (conn && conn.open) {
          conn.send({ type: "WIN" });
        }
        finishRace(true, "결승선을 가장 먼저 통과했습니다!");
      }
    }

    function drawCharacter(x, y, w, h, facing, skinId, label, isGhost) {
      const skin = SKINS[skinId] || SKINS[0];
      ctx.save();
      if (isGhost) ctx.globalAlpha = 0.62;

      // 몸통
      ctx.fillStyle = skin.body;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 7);
      ctx.fill();
      ctx.stroke();

      // 머리띠
      ctx.fillStyle = skin.band;
      ctx.fillRect(x + 2, y + 6, w - 4, 5);

      // 눈
      ctx.fillStyle = skin.eye;
      const eyeX = facing >= 0 ? x + w - 10 : x + 4;
      ctx.fillRect(eyeX, y + 13, 6, 6);

      // 이름표
      ctx.globalAlpha = 1;
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = isGhost ? "#fca5a5" : "#38bdf8";
      ctx.fillText(label, x + w * 0.5, y - 7);
      ctx.restore();
    }

    function render() {
      const theme = currentCourse.theme;

      // 배경 그라데이션
      const grad = ctx.createLinearGradient(0, 0, 0, viewH);
      grad.addColorStop(0, theme.bgTop);
      grad.addColorStop(1, theme.bgBot);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, viewW, viewH);

      // 내 캐릭터를 항상 화면 정중앙에 고정하는 카메라 좌표
      const camX = (player.x + player.w * 0.5) - viewW * 0.5;
      const camY = (player.y + player.h * 0.5) - viewH * 0.5;

      // 배경 그리드
      ctx.strokeStyle = "rgba(255, 255, 255, 0.06)";
      ctx.lineWidth = 1;
      const gridSize = 80;
      const offsetX = -(camX % gridSize);
      const offsetY = -(camY % gridSize);
      ctx.beginPath();
      for (let gx = offsetX; gx < viewW; gx += gridSize) {
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, viewH);
      }
      for (let gy = offsetY; gy < viewH; gy += gridSize) {
        ctx.moveTo(0, gy);
        ctx.lineTo(viewW, gy);
      }
      ctx.stroke();

      ctx.save();
      ctx.translate(-camX, -camY);

      // 발판 렌더링 (고대비 외곽선 + 상단 표면)
      for (const p of currentCourse.platforms) {
        ctx.fillStyle = theme.plat;
        ctx.fillRect(p.x, p.y, p.w, p.h);

        ctx.fillStyle = theme.platTop;
        ctx.fillRect(p.x, p.y, p.w, 8);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.48)";
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
      }

      // 스프링
      for (const s of currentCourse.springs) {
        ctx.fillStyle = "#facc15";
        ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(s.x - 2, s.y, s.w + 4, 5);
      }

      // 장애물
      for (const h of currentCourse.hazards) {
        ctx.fillStyle = theme.hazard;
        ctx.beginPath();
        ctx.moveTo(h.x, h.y + h.h);
        ctx.lineTo(h.x + h.w * 0.5, h.y);
        ctx.lineTo(h.x + h.w, h.y + h.h);
        ctx.closePath();
        ctx.fill();
      }

      // 체크포인트 깃발
      for (const cp of currentCourse.checkpoints) {
        ctx.fillStyle = "#cbd5e1";
        ctx.fillRect(cp.x - 2, cp.y, 4, 40);
        ctx.fillStyle = "#34d399";
        ctx.beginPath();
        ctx.moveTo(cp.x + 2, cp.y);
        ctx.lineTo(cp.x + 22, cp.y + 8);
        ctx.lineTo(cp.x + 2, cp.y + 16);
        ctx.closePath();
        ctx.fill();
      }

      // 결승선 깃발
      const g = currentCourse.goal;
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(g.x, g.y, 6, g.h);
      ctx.fillStyle = "#f43f5e";
      ctx.fillRect(g.x + 6, g.y, 44, 28);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText("GOAL", g.x + 12, g.y + 18);

      // 상대 고스트 캐릭터
      if (opponent.active) {
        drawCharacter(opponent.x, opponent.y, opponent.w, opponent.h, opponent.facing, opponent.skinId, "P2 (상대)", true);
      }

      // 대쉬 잔상 효과
      if (player.dashActiveTimer > 0) {
        ctx.fillStyle = "rgba(56, 189, 248, 0.35)";
        ctx.fillRect(player.x - player.facing * 24, player.y + 4, player.w, player.h - 8);
      }

      // 내 캐릭터 (화면 정중앙)
      drawCharacter(player.x, player.y, player.w, player.h, player.facing, selectedSkinId, "나 (ME)", false);

      ctx.restore();
    }

    let lastFrame = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      updatePhysics(dt, now / 1000);
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // ==========================================
    // 9. UI 버튼 이벤트 연결
    // ==========================================
    document.getElementById("btn-random-match").addEventListener("click", startOnlineMatch);
    document.getElementById("btn-bot-match").addEventListener("click", startBotMatch);

    document.getElementById("btn-exit-match").addEventListener("click", () => {
      cleanupNetwork();
      gameState = "LOBBY";
      document.getElementById("countdown-overlay").classList.add("hidden");
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("lobby-screen").classList.remove("hidden");
      document.getElementById("match-status").textContent = "원하는 모드를 선택해 레이스를 시작하세요!";
    });

    document.getElementById("btn-rematch").addEventListener("click", () => {
      if (matchMode === "ONLINE") startOnlineMatch();
      else startBotMatch();
    });

    document.getElementById("btn-result-lobby").addEventListener("click", () => {
      cleanupNetwork();
      gameState = "LOBBY";
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("lobby-screen").classList.remove("hidden");
      document.getElementById("match-status").textContent = "원하는 모드를 선택해 레이스를 시작하세요!";
    });
  </script>
</body>
</html>
